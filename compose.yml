services:
  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    working_dir: /app
    ports:
      - "5173:5173"
    volumes:
      - .:/app:delegated
      - root_node_modules:/app/node_modules
      - web_node_modules:/app/apps/web/node_modules
      - pnpm_store:/home/node/.local/share/pnpm/store
    environment:
      NODE_ENV: development
      API_PROXY_TARGET: http://api:8000

      # Ensure "home" is correct for the node user once we drop privileges
      HOME: /home/node

      # Optional: make Corepack explicit (it defaults to cache under HOME anyway)
      COREPACK_HOME: /home/node/.cache/corepack
    depends_on:
      - api

  api:
    build:
      context: ./apps/api
      dockerfile: Dockerfile
    working_dir: /app
    ports:
      - "8000:8000"
    volumes:
      - ./apps/api:/app:delegated
      - api_venv:/app/.venv
      - uv_cache:/root/.cache/uv
    environment:
      PYTHONUNBUFFERED: "1"
      UV_CACHE_DIR: /root/.cache/uv

volumes:
  root_node_modules:
  web_node_modules:
  pnpm_store:
  api_venv:
  uv_cache: