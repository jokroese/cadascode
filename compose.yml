services:
  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    ports:
      - "5173:5173"
    volumes:
      - .:/app
      - web_root_node_modules:/app/node_modules
      - web_app_node_modules:/app/apps/web/node_modules
      - web_pnpm_store:/home/node/.local/share/pnpm/store
    environment:
      - NODE_ENV=development
      - API_PROXY_TARGET=http://api:8000
      - CI=true
    depends_on:
      - api

  api:
    build:
      context: ./apps/api
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    volumes:
      - ./apps/api:/app
    environment:
      - PYTHONUNBUFFERED=1

volumes:
  web_root_node_modules:
  web_app_node_modules:
  web_pnpm_store:
