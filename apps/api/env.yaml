# Conda environment for CadQuery API (micromamba in Docker).
# Generate lockfile: conda-lock -k explicit -p linux-64 -f env.yaml
# Then: docker build -t cadascode-api ./apps/api

name: base
channels:
  - conda-forge
  - cadquery
channel_priority: strict
dependencies:
  - python=3.12
  - fastapi
  - uvicorn
  - pydantic

  # CadQuery stack (OCCT/OCP; conda is the known-good route)
  - cadquery

  # Test/tools (optional in runtime; keep initially to reduce surprise)
  - pytest
  - ruff
  - pyright

  # Helpful runtime basics
  - pip
