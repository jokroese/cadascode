name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install mise (with cache)
        uses: jdx/mise-action@v3
        with:
          install: true
          cache: true

      - name: Get pnpm store path
        id: pnpm-store
        run: echo "path=$(mise x -- pnpm store path)" >> $GITHUB_OUTPUT

      - name: Cache pnpm store
        uses: actions/cache@v4
        with:
          path: ${{ steps.pnpm-store.outputs.path }}
          key: pnpm-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: |
            pnpm-${{ runner.os }}-

      - name: Install JS dependencies
        run: mise x -- pnpm -w install --frozen-lockfile

      - name: Sanity check (SvelteKit CLI present)
        run: mise x -- pnpm --filter web exec svelte-kit --version

      - name: JS checks
        run: |
          mise x -- pnpm -w run check
          mise x -- pnpm -w run typecheck
          mise x -- pnpm -w run test

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Install Python dependencies
        working-directory: apps/api
        run: uv sync --frozen

      - name: Python checks
        working-directory: apps/api
        run: |
          uv run ruff check
          uv run ruff format --check
          uv run pyright
          uv run pytest

      - name: Build API Docker image
        run: docker build -t cadascode-api:ci ./apps/api

      - name: Build Web Docker image
        run: docker build -t cadascode-web:ci -f apps/web/Dockerfile .
